{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="page-heading">
  <div>
    <h1>{{ title }}</h1>
    <p class="page-description">{{ message }}</p>
  </div>
</section>
<section class="sheet">
  <div class="empty-state">
    <h3>Error {{ status }}</h3>
    <p>Go back to the waste overview to see the totals and records.</p>
    <a class="button button-primary" href="{{ url_for('dashboard') }}">Open the waste overview</a>
  </div>
</section>
{% endblock %}
