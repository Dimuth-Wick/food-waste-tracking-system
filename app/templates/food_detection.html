{% extends "base.html" %}
{% block title %}Food counting{% endblock %}
{% block content %}
<div class="page-heading">
  <div>
    <p class="eyebrow">COMPUTER VISION DEMO</p>
    <h1>Food counting</h1>
    <p class="page-description">Add a photo, type what to count, and check each item the model pins. Counts are not saved as waste records.</p>
  </div>
</div>

<link rel="stylesheet" href="{{ url_for('static', filename='food-counter/food-counter.css') }}">
<div id="food-counter" data-settings="{{ settings|tojson|forceescape }}">
  <noscript>
    <div class="notice notice-error">Food counting needs JavaScript. Turn it on in your browser and reload the page.</div>
  </noscript>
</div>
<script type="module" src="{{ url_for('static', filename='food-counter/food-counter.js') }}"></script>
{% endblock %}
